[package]
name = "typos-mayhem-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.typos]
path = "../../crates/typos"

[dependencies.varcon-core]
path = "../../crates/varcon-core"
features = ["parser"]

# Prevent this from interfering with the repo's root workspace
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false

[[bin]]
name = "cluster_parse"
path = "fuzz_targets/cluster_parse.rs"
test = false
doc = false
